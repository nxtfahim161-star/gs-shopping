name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি চেকআউট করা
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. জাভা জেডিকে (Java JDK 17) সেটআপ করা (v4 থেকে v5 আপডেট করা হয়েছে)
      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # ৩. ফ্লাটার SDK সেটআপ করা
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # ৪. ফ্লাটার ডিপেন্ডেন্সি ইনস্টল করা
      - name: Install Dependencies
        run: flutter pub get

      # ৫. রিলিজ এপিকে (Release APK) বিল্ড করা
      - name: Build Release APK
        run: flutter build apk --release

      # ৬. তৈরি হওয়া APK ফাইলটি গিটহাব আর্কিটেক্টসে আপলোড করা
      - name: Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
